<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D8C2A6">
<title>The Big Dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background-color: #C9B196;
    background-image: linear-gradient(90deg, rgba(255, 252, 247, 0.22) 0%, rgba(255, 252, 247, 0) 42%, rgba(120, 96, 72, 0.05) 100%), linear-gradient(180deg, #E9D8C3 0%, #E3D0B8 34%, #D8C2A6 68%, #C9B196 100%);
    background-repeat: no-repeat;
    background-size: cover;
    color: #2A2420;
  }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    font-family: "Cormorant Garamond", "Times New Roman", serif;
  }
  .sheet {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(100%, 360px);
  }
  .wordmark {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .status {
    margin: 21px 0 0;
    font-size: 1.16rem;
    line-height: 1.618;
    color: #2A2420;
  }
  .fallback {
    margin: 13px 0 0;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .fallback a {
    color: #2A2420;
  }
  .camera {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 21px;
    min-height: 52px;
    min-width: min(100%, 280px);
    padding: 14px 28px;
    background: #2A2420;
    color: #F4EFE6;
    border: 1px solid #2A2420;
    box-shadow: none;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.2;
    text-decoration: none;
  }
  .camera:hover,
  .camera:focus-visible {
    background: #1F1B18;
    border-color: #1F1B18;
    color: #F4EFE6;
  }
  .camera:focus-visible {
    outline: 2px solid #2A2420;
    outline-offset: 3px;
  }
  @media (max-width: 760px) {
    .wordmark { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="sheet">
  <p class="wordmark">The Big Dinner</p>
  <p class="status">Opening Instagram…</p>
  <a class="camera" href="instagram://story-camera">Open Instagram camera</a>
  <noscript>
    <p class="fallback"><a href="https://www.instagram.com/thebigdinnerr">https://www.instagram.com/thebigdinnerr</a></p>
  </noscript>
</div>
<script>
  (function () {
    var android = /Android/i.test(navigator.userAgent || "");
    window.location = android
      ? "intent://story-camera#Intent;package=com.instagram.android;scheme=instagram;end"
      : "instagram://story-camera";
    window.setTimeout(function () {
      if (document.visibilityState === "visible") {
        window.location = "https://www.instagram.com/";
      }
    }, 1500);
  })();
</script>
</body>
</html>
