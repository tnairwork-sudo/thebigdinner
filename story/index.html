<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>The Big Dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #ffffff;
    color: #1a1a1a;
  }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    font-family: "Cormorant Garamond", "Times New Roman", serif;
  }
  .wordmark {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .status {
    margin: 21px 0 0;
    font-size: 1.16rem;
    line-height: 1.618;
    color: #4a453f;
  }
  .fallback {
    margin: 13px 0 0;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .fallback a {
    color: #1a1a1a;
  }
  @media (max-width: 760px) {
    .wordmark { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<p class="wordmark">The Big Dinner</p>
<p class="status">Opening Instagram…</p>
<noscript>
  <p class="fallback"><a href="https://www.instagram.com/thebigdinnerr">https://www.instagram.com/thebigdinnerr</a></p>
</noscript>
<script>
  (function () {
    var android = /Android/i.test(navigator.userAgent || "");
    window.location = android
      ? "intent://story-camera#Intent;package=com.instagram.android;scheme=instagram;end"
      : "instagram://story-camera";
    window.setTimeout(function () {
      if (document.visibilityState === "visible") {
        window.location = "https://www.instagram.com/";
      }
    }, 1500);
  })();
</script>
</body>
</html>
