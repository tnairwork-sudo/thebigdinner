<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F3D56A">
<title>The Big Dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background-color: #D9AE3A;
    background-image: linear-gradient(108deg, rgba(255, 250, 232, 0) 38%, rgba(255, 250, 232, 0.4) 47%, rgba(255, 255, 255, 0.22) 50%, rgba(255, 250, 232, 0.32) 53%, rgba(255, 250, 232, 0) 62%), linear-gradient(122deg, #F7E08A 0%, #F4D56A 22%, #EFCB5A 48%, #E6B84A 73%, #D9AE3A 100%);
    background-repeat: no-repeat;
    background-size: 260% 100%, cover;
    background-position: 35% 0%, center;
    color: #062E24;
    animation: gold-shimmer 36s ease-in-out infinite alternate;
  }
  @keyframes gold-shimmer {
    from { background-position: 0% 0%, center; }
    to { background-position: 100% 0%, center; }
  }
  @media (prefers-reduced-motion: reduce) {
    html, body { animation: none; }
  }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    font-family: "Cormorant Garamond", "Times New Roman", serif;
  }
  .sheet {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: min(100%, 360px);
  }
  .wordmark {
    margin: 0;
    font-size: 1.45rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .status {
    margin: 21px 0 0;
    font-size: 1.16rem;
    line-height: 1.618;
    color: #062E24;
  }
  .fallback {
    margin: 13px 0 0;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .fallback a {
    color: #062E24;
  }
  .camera {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 21px;
    min-height: 52px;
    min-width: min(100%, 280px);
    padding: 14px 28px;
    background: #062E24;
    color: #F4EFE6;
    border: 1px solid #062E24;
    box-shadow: none;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    line-height: 1.2;
    text-decoration: none;
  }
  .camera:hover,
  .camera:focus-visible {
    background: #F4EFE6;
    border-color: #062E24;
    color: #062E24;
  }
  .camera:focus-visible {
    outline: 2px solid #062E24;
    outline-offset: 3px;
  }
  @media (max-width: 760px) {
    .wordmark { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="sheet">
  <p class="wordmark">The Big Dinner</p>
  <p class="status">Opening Instagram…</p>
  <a class="camera" href="instagram://story-camera">Open Instagram camera</a>
  <noscript>
    <p class="fallback"><a href="https://www.instagram.com/thebigdinnerr">https://www.instagram.com/thebigdinnerr</a></p>
  </noscript>
</div>
<script>
  (function () {
    var android = /Android/i.test(navigator.userAgent || "");
    window.location = android
      ? "intent://story-camera#Intent;package=com.instagram.android;scheme=instagram;end"
      : "instagram://story-camera";
    window.setTimeout(function () {
      if (document.visibilityState === "visible") {
        window.location = "https://www.instagram.com/";
      }
    }, 1500);
  })();
</script>
</body>
</html>
