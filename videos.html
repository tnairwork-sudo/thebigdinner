<body>

<header class="nav" data-nav>
  <a class="wordmark" href="/">The Big Dinner</a>
  <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="nav-menu">Menu</button>
  <nav class="nav-links" id="nav-menu">

</header>
<main id="content" class="films">
  <h1>Films</h1>
  <div class="filters" role="group" aria-label="Filter films">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="Delhi" aria-pressed="false">Delhi</button>
    <button type="button" data-filter="London" aria-pressed="false">London</button>
  </div>
  <div id="feed"></div>
</main>
<footer class="colophon">
  <a class="wordmark" href="/">The Big Dinner</a>
  <p><a href="mailto:host@thebigdinner.in">host@thebigdinner.in</a></p>
  <nav aria-label="House notes">
    <a href="/contact">Contact</a>
    <a href="/terms">Terms</a>
    <a href="/refunds">Refunds</a>
  </nav>
</footer>
<script src="/site.js"></script>
<script>
  var films = [
    { city: "Delhi", title: "October 2025", text: "The first room. Forty people, and a conversation with nowhere to hide.", image: "/shangrila.jpeg", url: "https://www.instagram.com/reel/DXHoszFk5rh/" },
    { city: "Delhi", title: "November 2025", text: "The second evening. Familiar faces, a different quiet.", image: "/november3.jpeg", url: "https://www.instagram.com/reel/DWgxUGoE5QY/" },
    { city: "Delhi", title: "December 2025", text: "The year ending. The room a little fuller.", image: "/dec11.jpeg", url: "https://www.instagram.com/reel/DWct-0CTRkX/" },
    { city: "Delhi", title: "January 2026", text: "A new year, the same idea at the centre.", image: "/jan1.jpeg", url: "https://www.instagram.com/reel/DWV6gUnE2y1/" },
    { city: "Delhi", title: "February 2026", text: "Sharper conversation, the same closed room.", image: "/sbhangrila.jpeg", url: "https://www.instagram.com/reel/DVSmvZnkjGE/" },
    { city: "Delhi", title: "March 2026", text: "Delhi, dressed for the evening.", image: "/itcmaurya.jpeg", url: "https://www.instagram.com/reel/DUKeaZWkjSO/" },
    { city: "London", title: "London", text: "The same room, held by friends.", image: "/lodnon.jpeg", url: "" }
  ];
  var feed = document.getElementById("feed");
  var current = "all";
  function render() {
    feed.innerHTML = "";
    films.filter(function (film) { return current === "all" || film.city === current; }).forEach(function (film) {
      var article = document.createElement("article");
      article.className = "film";
      var link = film.url ? '<a class="play" href="' + film.url + '" target="_blank" rel="noopener noreferrer">Watch</a>' : "";
      article.innerHTML = '<img src="' + film.image + '" alt="' + film.city + ', ' + film.title + '" loading="lazy" decoding="async"><h2>' + film.title + '</h2><p>' + film.text + '</p>' + link;
      feed.appendChild(article);
    });
  }
  document.querySelectorAll(".filters button").forEach(function (button) {
    button.addEventListener("click", function () {
      current = button.getAttribute("data-filter");
      document.querySelectorAll(".filters button").forEach(function (other) {
        other.setAttribute("aria-pressed", other === button ? "true" : "false");
      });
      render();
    });
  });
  render();
</script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script><script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
