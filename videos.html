<script src="/site.js"></script>
<script>
  var ALL_VIDEOS = [
    {
      id: 1,
      city: "Delhi",
      chapter: "Chapter I",
      date: "October 2025",
      venue: "Blue Bar",
      guestCount: 40,
      description: "The first room. Forty people, no chairs, no agenda, no name tags. A bet on conversation placed inside the oldest bar in New Delhi.",
      videoUrl: "https://www.instagram.com/reel/DXHoszFk5rh/",
      thumbnail: "/shangrila.jpeg"
    },
    {
      id: 2,
      city: "Delhi",
      chapter: "Chapter II",
      date: "November 2025",
      venue: "Megu, The Leela Palace",
      guestCount: 36,
      description: "The second chapter deepened the experiment. Familiar faces, unfamiliar territory. The Japanese room at The Leela asked something different of everyone.",
      videoUrl: "https://www.instagram.com/reel/DWgxUGoE5QY/",
      thumbnail: "/november3.jpeg"
    },
    {
      id: 3,
      city: "Delhi",
      chapter: "Chapter III",
      date: "December 2025",
      venue: "Megu, The Leela Palace",
      guestCount: 42,
      description: "December brought a different energy. The year ending, the room fuller. The conversations turned inward.",
      videoUrl: "https://www.instagram.com/reel/DWct-0CTRkX/",
      thumbnail: "/dec11.jpeg"
    },
    {
      id: 4,
      city: "Delhi",
      chapter: "Chapter IV",
      date: "January 2026",
      venue: "The Imperial Hotel",
      guestCount: 38,
      description: "The Imperial held something classical. New year, new people, but the same idea at the centre of it all.",
      videoUrl: "https://www.instagram.com/reel/DWV6gUnE2y1/",
      thumbnail: "/jan1.jpeg"
    },
    {
      id: 5,
      city: "Delhi",
      chapter: "Chapter V",
      date: "February 2026",
      venue: "Shangri-La Eros",
      guestCount: 44,
      description: "The city's most recognisable room. Something about its familiarity made the conversations sharper.",
      videoUrl: "https://www.instagram.com/reel/DVSmvZnkjGE/",
      thumbnail: "/sbhangrila.jpeg"
    },
    {
      id: 6,
      city: "Delhi",
      chapter: "Chapter VI",
      date: "March 2026",
      venue: "Ottimo, ITC Maurya",
      guestCount: 40,
      description: "The final Delhi chapter before the expansion. The ITC Maurya asked the room to dress for the occasion.",
      videoUrl: "https://www.instagram.com/reel/DUKeaZWkjSO/",
      thumbnail: "/itcmaurya.jpeg"
    },
    {
      id: 7,
      city: "Mumbai",
      chapter: "Chapter VII",
      date: "April 2026",
      venue: "Harbour Bar",
      guestCount: 45,
      description: "The first room outside Delhi. Mumbai asked new questions. The harbour lit the room differently.",
      videoUrl: "YOUR_VIDEO_URL_HERE",
      thumbnail: "/bombay1.jpg"
    },
    {
      id: 8,
      city: "London",
      chapter: "London I",
      date: "February 2026",
      venue: "London",
      guestCount: 30,
      description: "Expansion was never about geography. It was about trust. Friends held the room.",
      videoUrl: "YOUR_VIDEO_URL_HERE",
      thumbnail: "/lodnon.jpeg"
    }
  ];

  var PAGE_SIZE = 3;
  var currentFilter = "all";
  var currentPage = 0;
  var isLoading = false;
  var allLoaded = false;
  var feed = document.getElementById("video-feed");
  var spinner = document.getElementById("spinner");
  var endNote = document.getElementById("end-note");

  function getFilteredVideos() {
    return currentFilter === "all"
      ? ALL_VIDEOS
      : ALL_VIDEOS.filter(function (video) { return video.city === currentFilter; });
  }

  function resetFeed() {
    currentPage = 0;
    allLoaded = false;
    feed.innerHTML = "";
    endNote.classList.remove("visible");
  }

  function buildCard(video) {
    var article = document.createElement("article");
    article.className = "video-card";
    article.dataset.city = video.city;
    article.innerHTML =
      '<div class="video-wrapper" role="button" tabindex="0" aria-label="Watch ' + video.chapter + ', ' + video.city + ', ' + video.date + '">' +
        '<img class="thumb" src="' + video.thumbnail + '" alt="' + video.city + ' room, ' + video.date + '" loading="lazy" decoding="async">' +
        '<div class="card-meta-overlay">' +
          '<p class="card-city-tag">' + video.city + ' · ' + video.date + '</p>' +
          '<h2 class="card-venue">' + video.venue + '</h2>' +
          '<p class="card-chapter">' + video.chapter + '</p>' +
        '</div>' +
        '<div class="play-overlay"><div class="play-btn" aria-hidden="true">' +
          '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><polygon points="6,3 21,12 6,21"/></svg>' +
        '</div></div>' +
      '</div>' +
      '<p class="card-description">' + video.description + '</p>' +
      '<div class="card-footer-row">' +
        '<span class="guest-pill">' + video.guestCount + ' Guests</span>' +
        '<span class="city-pill">' + video.chapter + '</span>' +
      '</div>';

    var frame = article.querySelector(".video-wrapper");
    function play() { handlePlay(video.id); }
    frame.addEventListener("click", play);
    frame.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        play();
      }
    });
    return article;
  }

  function loadNextBatch() {
    if (isLoading || allLoaded) return;
    isLoading = true;
    spinner.classList.add("active");

    setTimeout(function () {
      var filtered = getFilteredVideos();
      var start = currentPage * PAGE_SIZE;
      var batch = filtered.slice(start, start + PAGE_SIZE);

      if (batch.length === 0) {
        allLoaded = true;
        spinner.classList.remove("active");
        endNote.classList.add("visible");
        isLoading = false;
        return;
      }

      batch.forEach(function (video, i) {
        var card = buildCard(video);
        feed.appendChild(card);
        setTimeout(function () { entranceObserver.observe(card); }, i * 80);
      });

      currentPage++;
      spinner.classList.remove("active");
      isLoading = false;

      if (currentPage * PAGE_SIZE >= filtered.length) {
        allLoaded = true;
        endNote.classList.add("visible");
      }
    }, 500);
  }

  var entranceObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      entry.target.classList.add("visible");
      entranceObserver.unobserve(entry.target);
    });
  }, { threshold: 0.08 });

  var sentinelObserver = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting && !allLoaded) loadNextBatch();
  }, { rootMargin: "300px" });

  sentinelObserver.observe(document.getElementById("load-sentinel"));

  document.querySelectorAll(".filter-tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".filter-tab").forEach(function (item) {
        item.classList.remove("active");
      });
      tab.classList.add("active");
      currentFilter = tab.dataset.filter;
      resetFeed();
      loadNextBatch();
    });
  });

  function handlePlay(id) {
    var video = ALL_VIDEOS.find(function (item) { return item.id === id; });
    if (!video) return;
    if (video.videoUrl && video.videoUrl !== "YOUR_VIDEO_URL_HERE") {
      window.open(video.videoUrl, "_blank", "noopener,noreferrer");
    }
  }

  loadNextBatch();
</script>
